# Optional paid configuration. Review Render's current service and disk prices before applying.
services:
  - type: web
    name: panos-os
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && VITE_API_URL=/ VITE_PUBLIC_DEMO=true npm run web:build
    startCommand: node --import tsx apps/web/src/online-server.ts
    healthCheckPath: /health
    disk:
      name: panos-os-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SITE_PASSWORD
        sync: false
      - key: PUBLIC_DEMO
        value: "true"
      - key: KHAN_DATA_DIR
        value: /var/data
      - key: KHAN_STORAGE_DURABLE
        value: "true"
